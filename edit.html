<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Service Record</title>
    <link rel="stylesheet" href="edit.css">

    <!-- SIMPLE JS -->
    <script type="text/javascript" src="editpage.js">
       
    </script>
</head>
<body>

<div class="edit-container">
    <h2>Edit Service Details</h2>
    <p class="subtitle">Only editable fields can be modified</p>

    <form class="edit-form" action="#" method="post" id="editForm">

        <!-- READ ONLY -->
        <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="customerName" name="customerName" readonly>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="CustomerPhone" name="customerPhone" readonly>
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" id="Machine" name="machine" readonly>
        </div>

        <div class="form-group">
            <label>Given Date</label>
            <input type="text" id="now" name="now" readonly>
        </div>


        <!-- EDITABLE -->
        <div class="form-group">
            <label>Changed Parts</label>
            <input type="text" id="changePart" name="changePart"  required>
        </div>

        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" id="price" name="price1" required>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="status" name="status" required>
                <option>Pending</option>
                <option selected>Completed</option>
            </select>
        </div>

        <!-- DELIVERY DATE (SHOW ONLY WHEN COMPLETED) -->
        <div class="form-group" id="delivery-section">
            <label>Delivery Date</label>
            <input type="date" id="late" name="late">
        </div>

        <div class="btn-group">
            <button type="submit">Update</button>
            <a href="view.html" class="cancel">Cancel</a>
        </div>

    </form>
</div>
<script type="text/javascript">
    window.onload = function() {
    edit();

    }
    </script>
</body>
</html>
