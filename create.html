<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Service Entry</title>
    <link rel="stylesheet" href="service-entry.css">
</head>

<body>

    <div class="container">
        <div class="form-box">
            <h2>Customer Service Entry</h2>
            <p class="subtitle">Enter customer and machine details</p>

              <form onsubmit="submitForm(event)">
                <label>Customer ID / Serial No (Optional)</label>
                <input type="number" placeholder="Eg: 43016 (Leave blank for auto-increment)" name="customerId">

                <label>Customer Name</label>
                <input type="text" placeholder="Enter customer name" name="CustomerName" required>

                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number" name="CustomerPhone" required>

                <label>Machine Name</label>
                <input type="text" placeholder="Eg: TV / Washing Machine" name="Machine" required>
                <br>
                <label>Status</label>
                <select name="status" required>
                    
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>


                <button type="submit" onclick="submit()">Submit</button>
            </form>
        </div>
    </div>

</body>
<script>
    const SERVER_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? "http://localhost:8080"
        : "https://electrial-backend.onrender.com";

    function submitForm(event) {
    event.preventDefault(); // stop normal form submit

    const data = new URLSearchParams();
    const customId = document.querySelector('[name="customerId"]').value;
    if (customId) {
        data.append("customerId", customId);
    }
    data.append("CustomerName", document.querySelector('[name="CustomerName"]').value);
    data.append("CustomerPhone", document.querySelector('[name="CustomerPhone"]').value);
    data.append("Machine", document.querySelector('[name="Machine"]').value);
    data.append("status", document.querySelector('[name="status"]').value);

    const token = localStorage.getItem("token");
    if (!token) {
        alert("Please login first");
        window.location.href = "index.html";
        return;
    }

    fetch(`${SERVER_URL}/auth/users/customerEnter`, {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token
        },
        body: data
    })
    .then(response => response.text())
    .then(result => {
        alert("Saved Successfully!");
        window.location.href = "dashboard.html"; // ✅ NOW redirect works
    })
    .catch(error => console.error(error));
}
</script>
</html>
