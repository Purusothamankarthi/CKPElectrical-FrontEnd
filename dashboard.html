<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Shop Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

<div class="dashboard">
    <h2>Service Shop Dashboard</h2>
    <p class="subtitle">Manage service operations</p>

    <div class="card-container">
        <a href="create.html" class="card">
            <h3>Create</h3>
            <p>Add new customer service</p>
        </a>

        <a href="view.html" class="card">
            <h3>View</h3>
            <p>View service records</p>
        </a>

        
    </div>

    <a href="index.html" onclick="logout()" class="logout">Logout</a>
</div>

<script>
    // 🔐 Verify token when dashboard loads
    window.onload = function () {
        const loader = document.getElementById("loadingOverlay");
        if (loader) loader.classList.add("hidden");

        const token = localStorage.getItem("token");

        if (!token) {
            alert("Please login first");
            window.location.href = "index.html";
        }
    };

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }
    
</script>


</body>
</html>
