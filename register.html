<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Shop Register</title>
    <link rel="stylesheet" href="register.css">
    <script type="text/javascript" src="index.js"></script>
</head>

<body>

    <div class="container">
        <div class="register-box">
            <h2>Create Account</h2>
            <p class="subtitle">Register your service shop account</p>
            <form   onsubmit="register(event)">
                <label for="Fullname">Full Name</label>
                <input type="text" placeholder="Enter full name" id="Fullname" name="Fullname" required>

                <label for="phonenumber">Phone Number</label>
                <input type="tel" placeholder="Enter phone number" id="phonenumber" name="phonenumber" required>

                <label for="name">Username</label>
                <input type="text" placeholder="Choose username" id="name" name="name" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" placeholder="Create password" id="password" autocomplete="new-password" name="password1" required>

                <label for="password2">Confirm Password</label>
                <input type="password" placeholder="Confirm password" id="password2"  name="password2" autocomplete="new-password" required>

                <button type="submit" >Register</button>
            </form>


            <p class="login-link">
                Already have an account?
                <a href="index.html">Login</a>
            </p>
            </form>
        </div>
    </div>

</body>

</html>
