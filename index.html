<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Shop Login</title>
    <link rel="stylesheet" href="index.css">
    <script type="text/javascript" src="index.js"></script>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

<div class="container">
    <div class="login-box">
        <h2>Service Shop Login</h2>
        <p class="subtitle">Manage customer service details</p>

        <form  onsubmit="login(event)">
            <label for="name">Username</label>
            <input type="text" placeholder="Enter username" id="name" name="name" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" placeholder="Enter password" id="password" name="password1" autocomplete="new-password" required>

            <button type="submit" >Login</button>
            <br>
             <a href="register.html" class="register">Are you not ?<span>Register</span></a>
             <br><br>
            <a href="forgot.html" class="forgot">forget password?</a>
        </form>

    

       
    </div>
</div>

</body>
</html>
