<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service Shop Login</title>
    <link rel="stylesheet" href="index.css">
    
</head>
<body>

<div class="container">
    <div class="login-box">
        <h2>Service Shop Login</h2>
        <p class="subtitle">Manage customer service details</p>

        <form   >
            <label>Username</label>
            <input type="text" placeholder="Enter username" id="name" name="name" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" id="password" name="password" autocomplete="new-password" required>

            <button type="submit" >Login</button>
            <br>
             <a href="register.html" class="register">Are you not ?<span>Register</span></a>
             <br><br>
            <a href="forgot.html" class="forgot">forget password?</a>
        </form>

    

       
    </div>
</div>

</body>
</html>
